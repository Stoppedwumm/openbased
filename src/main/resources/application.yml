server:
  port: 8080
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: openbased
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:${openbased.data-dir:./data}/db/openbased
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    async:
      request-timeout: -1
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/v1/docs
  paths-to-match: /api/v1/**

openbased:
  issuer: http://localhost:8080
  data-dir: ./data
  # Origins of separately hosted browser clients, e.g. http://localhost:5173
  cors-allowed-origins: []
  bootstrap:
    admin-username: admin
    # Leave empty to generate a password on first start (it is logged once).
    admin-password:
  tokens:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    personal-token-default-ttl: 90d
    personal-token-max-ttl: 365d
  clients:
    # Public browser client: Authorization Code + PKCE.
    - client-id: openbased-web
      name: OpenBased Web
      redirect-uris:
        - http://localhost:8080/callback
        - http://localhost:5173/callback
      post-logout-redirect-uris:
        - http://localhost:8080/
      grant-types: [authorization_code]
    # Example confidential machine-to-machine client. It acts with the permissions of service-user.
    # - client-id: home-automation
    #   client-secret: change-me
    #   grant-types: [client_credentials]
    #   scopes: [media.read, library.read]
    #   service-user: automation
  rate-limit:
    enabled: true
    limit: 1000
    window: 1m
  uploads:
    chunk-size: 10485760
    max-size: 214748364800
  playback:
    ffmpeg: ffmpeg
    ffprobe: ffprobe
    idle-timeout: 4h
  metadata:
    default-provider: tmdb
    auto-match: true
    tmdb:
      api-key: ${TMDB_API_KEY:}
      language: en-US
  jobs:
    workers: 2
